<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Slideshow - Fade Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .slideshow-container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .slideshow-wrapper {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide.active {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            background: white;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .prev-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .next-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .slide-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
        }

        h1 {
            text-align: center;
            padding: 20px;
            color: #333;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="slideshow-container">
        <h1>jQuery Slideshow</h1>
        
        <div class="slideshow-wrapper">
            <div class="slide active">
                <img src="https://i.pinimg.com/736x/75/5f/97/755f97ef5e3fd1b42f0b7562b6a27f45.jpg" alt="Gambar 1 - Taehyun">
            </div>
            <div class="slide">
                <img src="https://i.pinimg.com/736x/41/36/2d/41362de21d962d980938c8a46b862f74.jpg" alt="Gambar 2 - Taehyun">
            </div>
            <div class="slide">
                <img src="https://i.pinimg.com/736x/92/e0/a3/92e0a33c9f437080024709749031d5ce.jpg" alt="Gambar 3 - Taehyun">
            </div>
            
            <div class="slide-info">
                <span id="slide-counter">1 / 3</span>
            </div>
        </div>

        <div class="controls">
            <button class="prev-btn">← Prev</button>
            <button class="next-btn">Next →</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
        $(document).ready(function() {
            let currentSlide = 0;
            const slides = $('.slide');
            const totalSlides = slides.length;
            const fadeDuration = 600; 

            function updateCounter() {
                $('#slide-counter').text((currentSlide + 1) + ' / ' + totalSlides);
            }

            function showSlide(index) {
                slides.eq(currentSlide).fadeOut(fadeDuration, function() {
                    $(this).removeClass('active');
                });


                currentSlide = index;


                slides.eq(currentSlide).fadeIn(fadeDuration, function() {
                    $(this).addClass('active');
                });

                updateCounter();
            }


            $('.next-btn').click(function() {
                let nextSlide = (currentSlide + 1) % totalSlides;
                showSlide(nextSlide);
            });

            $('.prev-btn').click(function() {
                let prevSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                showSlide(prevSlide);
            });

            $(document).keydown(function(e) {
                if (e.key === 'ArrowRight') {
                    $('.next-btn').click();
                } else if (e.key === 'ArrowLeft') {
                    $('.prev-btn').click();
                }
            });

           
        });
    </script>
</body>
</html>
